name: Container
on: [push, pull_request]
permissions: {}
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            image: ubuntu-latest

          - arch: arm64
            image: ubuntu-24.04-arm
    runs-on: ${{ matrix.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t "$IMAGE_NAME:latest-${{ matrix.arch }}" .

      - name: Save image
        run: |
          docker save -o ${{ github.event.repository.name }}-image-${{ matrix.arch }}.tar \
            "$IMAGE_NAME:latest-${{ matrix.arch }}"

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-image-${{ matrix.arch }}
          path: ${{ github.event.repository.name }}-image-${{ matrix.arch }}.tar
          if-no-files-found: error

  publish:
    if: github.event.repository.fork == false && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Load images
        run: |
          docker load --input ${{ github.event.repository.name }}-image-amd64.tar
          docker load --input ${{ github.event.repository.name }}-image-arm64.tar

      - name: Authenticate
        run: echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish images
        run: |
          docker push "$IMAGE_NAME:latest-amd64"
          docker push "$IMAGE_NAME:latest-arm64"

          docker buildx imagetools create \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:latest-amd64" \
            "$IMAGE_NAME:latest-arm64"

      - name: Load image digests
        run: |
          echo "IMAGE_AMD64_SHA=$(
            docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:latest-amd64" |
            cut -d'@' -f2
          )" >> "$GITHUB_ENV"

          echo "IMAGE_ARM64_SHA=$(
            docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:latest-arm64" |
            cut -d'@' -f2
          )" >> "$GITHUB_ENV"

      - name: Attest amd64 image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_AMD64_SHA }}

      - name: Attest arm64 image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_ARM64_SHA }}
